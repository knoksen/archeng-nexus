name: Deploy static site

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    # configure-pages reads the Pages site configuration through the API.
    permissions:
      contents: read
      pages: read
    # One build per ref. A newer push to the same pull request replaces an older
    # PR build; builds for main are never cancelled and never share a group with PRs.
    concurrency:
      group: pages-build-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build current root Pages site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate published routes and public subtree
        run: |
          test -f _site/index.html
          test -f _site/SECURITY.html
          test -f _site/DESKTOP.html
          test -f _site/assets/index.html
          diff -r public _site/public
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # Only deploy runs take the production lock, so pull-request validation can
    # never replace a queued production deployment.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
